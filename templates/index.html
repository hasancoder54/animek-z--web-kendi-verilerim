<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Arşiv Galerisi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        select {
            padding: 10px 15px;
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            font-size: 16px;
            outline: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            background: #0f172a;
        }
        .card-info {
            padding: 15px;
        }
        .category-tag {
            display: inline-block;
            background: var(--accent-color);
            color: #0f172a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .artist {
            font-size: 14px;
            color: #94a3b8;
        }
        /* Load More Container */
        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }
        .load-more-btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .load-more-btn:hover {
            opacity: 0.9;
        }
        .load-more-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        /* Modal Lightbox */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
        }
        .modal-controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Anime Görsel Arşivi</h1>
    </header>

    <div class="filters">
        <select id="categorySelect" onchange="changeCategory()">
            <option value="all">Tüm Kategoriler</option>
        </select>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="load-more-container" id="loadMoreContainer" style="display: none;">
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Devamını Yükle (10+)</button>
    </div>

    <!-- Modal / Büyük Görüntüleyici -->
    <div class="modal" id="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img id="modalImg" src="" alt="">
        <div class="modal-controls">
            <button class="btn" onclick="prevImage()">← Önceki</button>
            <a id="downloadBtn" class="btn" href="" download target="_blank">İndir</a>
            <button class="btn" onclick="nextImage()">Sonraki →</button>
        </div>
    </div>

    <script>
        let page = 1;
        let currentCategory = 'all';
        let allLoadedItems = [];
        let currentIndex = 0;

        // Performans için Intersection Observer (Sadece ekrandakiler yüklenir ve oynar)
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    let img = entry.target;
                    let src = img.getAttribute('data-src');
                    if (src && img.src !== src) {
                        img.src = src; // Ekrana girince yükle ve oynat
                    }
                } else {
                    let img = entry.target;
                    // Ekrandan çıkınca src'yi boşaltarak GIF animasyonunu durdur ve RAM'i rahatlat
                    if (!document.getElementById('modal').style.display || document.getElementById('modal').style.display === 'none') {
                        img.src = ""; 
                    }
                }
            });
        }, { rootMargin: "200px 0px" });

        async function initCategories() {
            try {
                let res = await fetch('/api/categories');
                let categories = await res.json();
                let select = document.getElementById('categorySelect');
                categories.forEach(cat => {
                    let opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat.toUpperCase();
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadItems(reset = false) {
            if (reset) {
                page = 1;
                allLoadedItems = [];
                document.getElementById('gallery').innerHTML = '';
            }

            try {
                let res = await fetch(`/api/items?category=${currentCategory}&page=${page}&limit=10`);
                let data = await res.json();

                allLoadedItems = allLoadedItems.concat(data.items);
                
                let gallery = document.getElementById('gallery');
                data.items.forEach((item, index) => {
                    let globalIndex = allLoadedItems.length - data.items.length + index;
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openModal(globalIndex);
                    
                    card.innerHTML = `
                        <img data-src="${item.image_url}" src="" alt="Anime">
                        <div class="card-info">
                            <span class="category-tag">${item.category.toUpperCase()}</span>
                            <div class="artist">Sanatçı: ${item.artist_name || 'Bilinmiyor'}</div>
                        </div>
                    `;
                    gallery.appendChild(card);
                });

                // Yeni eklenen resimleri gözlemciye (observer) kaydet
                document.querySelectorAll('.card img').forEach(img => {
                    observer.observe(img);
                });

                let loadMoreContainer = document.getElementById('loadMoreContainer');
                if (data.has_more) {
                    loadMoreContainer.style.display = 'block';
                    page++;
                } else {
                    loadMoreContainer.style.display = 'none';
                }

            } catch (err) {
                console.error(err);
            }
        }

        function changeCategory() {
            currentCategory = document.getElementById('categorySelect').value;
            loadItems(true);
        }

        function loadMore() {
            loadItems(false);
        }

        // Modal Fonksiyonları
        function openModal(index) {
            currentIndex = index;
            updateModalContent();
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function updateModalContent() {
            let item = allLoadedItems[currentIndex];
            if (!item) return;
            document.getElementById('modalImg').src = item.image_url;
            document.getElementById('downloadBtn').href = item.image_url;
        }

        function nextImage() {
            if (currentIndex < allLoadedItems.length - 1) {
                currentIndex++;
                updateModalContent();
            }
        }

        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
                updateModalContent();
            }
        }

        // Klavye Ok Tuşları Desteği
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('modal').style.display === 'flex') {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeModal();
            }
        });

        // Başlangıç
        initCategories();
        loadItems(true);
    </script>
</body>
</html>
